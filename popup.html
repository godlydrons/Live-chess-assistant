<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Engine Pilot</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{width:260px;background:#141414;color:#e0e0e0;
         font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;user-select:none}
    .hdr{background:#0e0e0e;padding:13px 15px 11px;border-bottom:1px solid #1e1e1e;
         display:flex;align-items:center;gap:10px}
    .hdr-icon{font-size:22px}
    .hdr-title{font-size:15px;font-weight:700;color:#fff}
    .hdr-sub{font-size:10px;color:#444;margin-top:1px}
    .row{display:flex;align-items:center;justify-content:space-between;
         padding:12px 15px;border-bottom:1px solid #1e1e1e}
    .row-label{font-size:13px;color:#bbb}
    .switch{position:relative;width:44px;height:24px;flex-shrink:0}
    .switch input{opacity:0;width:0;height:0}
    .slider{position:absolute;inset:0;background:#2a2a2a;border-radius:24px;
            cursor:pointer;transition:background .2s}
    .slider::before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;
                    background:#555;border-radius:50%;transition:transform .2s,background .2s}
    input:checked+.slider{background:#145c32}
    input:checked+.slider::before{transform:translateX(20px);background:#3ecf74}
    .status-bar{padding:9px 15px;background:#0c0c0c;border-bottom:1px solid #1e1e1e;
                font-size:11px;color:#555;min-height:32px;display:flex;align-items:center}
    .status-bar.live{color:#3ecf74}
    .status-bar.warn{color:#f59e0b}
    .section{padding:11px 15px;border-bottom:1px solid #1e1e1e}
    .sec-title{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#3a3a3a;margin-bottom:9px}
    .srow{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
    .srow:last-child{margin-bottom:0}
    .sname{font-size:12px;color:#999}
    .sctrl{display:flex;align-items:center;gap:5px}
    .sctrl button{width:22px;height:22px;background:#1e1e1e;border:1px solid #303030;
                  border-radius:5px;color:#777;font-size:14px;cursor:pointer;
                  display:flex;align-items:center;justify-content:center;transition:background .15s}
    .sctrl button:hover{background:#2a2a2a;color:#ccc}
    .snum{font-size:12px;font-weight:600;color:#ddd;min-width:28px;text-align:center}
    select{background:#1e1e1e;border:1px solid #303030;color:#ccc;
           font-size:12px;padding:3px 7px;border-radius:5px;cursor:pointer;outline:none}
    /* Mode toggle */
    .mode-row{display:flex;gap:6px;margin-bottom:0}
    .mode-btn{flex:1;padding:7px 4px;background:#1a1a1a;border:1px solid #2e2e2e;
              border-radius:6px;color:#666;font-size:11px;cursor:pointer;text-align:center;
              transition:all .15s}
    .mode-btn.active{background:#0d1f14;border-color:#3ecf74;color:#3ecf74}
    .crop-btn{width:100%;padding:9px;background:#1a1a1a;border:1px solid #2e2e2e;
              border-radius:7px;color:#aaa;font-size:12px;cursor:pointer;
              text-align:center;transition:background .15s,border-color .15s}
    .crop-btn:hover{background:#222;border-color:#3ecf74;color:#3ecf74}
    .crop-btn.set{border-color:#3ecf74;color:#3ecf74;background:#0d1f14}
    .crop-clear{font-size:10px;color:#ef4444;cursor:pointer;text-align:center;
                margin-top:5px;display:none}
    .log-entries{max-height:66px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
    .log-entry{font-size:11px;color:#444;font-family:'Consolas',monospace}
    .log-entry.fresh{color:#3ecf74}
    .log-entries::-webkit-scrollbar{width:3px}
    .log-entries::-webkit-scrollbar-thumb{background:#282828;border-radius:2px}
    .footer{padding:9px 15px;display:flex;align-items:center;gap:6px}
    .fdot{width:5px;height:5px;border-radius:50%;background:#6d28d9}
    .ftxt{font-size:10px;color:#333}
  </style>
</head>
<body>

<div class="hdr">
  <div class="hdr-icon">♟</div>
  <div>
    <div class="hdr-title">Engine Pilot</div>
    <div class="hdr-sub">Lichess engine assistant v6</div>
  </div>
</div>

<div class="row">
  <span class="row-label">Auto-play engine</span>
  <label class="switch">
    <input type="checkbox" id="toggle"/>
    <span class="slider"></span>
  </label>
</div>

<div class="status-bar" id="statusBar">⚫ Inactive</div>

<div class="section">
  <div class="sec-title">Mode</div>
  <div class="mode-row">
    <button class="mode-btn active" id="modeAutoplay">⚡ Auto-play</button>
    <button class="mode-btn"        id="modeHighlight">🟡 Highlight only</button>
  </div>
</div>

<div class="section">
  <div class="sec-title">Engine</div>
  <div class="srow">
    <span class="sname">Depth</span>
    <div class="sctrl">
      <button id="dD">−</button>
      <span class="snum" id="depthV">8</span>
      <button id="dU">+</button>
    </div>
  </div>
  <div class="srow">
    <span class="sname">Move delay (ms)</span>
    <div class="sctrl">
      <button id="lD">−</button>
      <span class="snum" id="delayV">100</span>
      <button id="lU">+</button>
    </div>
  </div>
  <div class="srow">
    <span class="sname">Orientation</span>
    <select id="oriSel">
      <option value="auto">Auto-detect</option>
      <option value="white">White</option>
      <option value="black">Black</option>
    </select>
  </div>
</div>

<div class="section">
  <div class="sec-title">Board detection</div>
  <button class="crop-btn" id="cropBtn">✏️  Draw board crop box</button>
  <div class="crop-clear" id="cropClear">✕ Clear crop box</div>
</div>

<div class="section">
  <div class="sec-title">Move log</div>
  <div class="log-entries" id="logEl">
    <div class="log-entry" style="color:#2a2a2a">— no moves yet —</div>
  </div>
</div>

<div class="footer">
  <div class="fdot"></div>
  <span class="ftxt">stockfish.online · reactive WS mode</span>
</div>

<script src="popup.js"></script>
</body>
</html>
