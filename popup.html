<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Engine Pilot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 240px;
      background: #1a1a1a;
      color: #e8e8e8;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      user-select: none;
    }

    /* ── Header ── */
    .header {
      background: #111;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-icon {
      font-size: 22px;
      line-height: 1;
    }
    .header-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: #fff;
    }
    .header-sub {
      font-size: 10px;
      color: #666;
      margin-top: 1px;
    }

    /* ── Toggle ── */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 16px 14px;
      border-bottom: 1px solid #232323;
    }
    .toggle-label {
      font-size: 13px;
      font-weight: 500;
      color: #ccc;
    }

    .switch {
      position: relative;
      width: 44px;
      height: 24px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: #333;
      border-radius: 24px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 18px; height: 18px;
      left: 3px; top: 3px;
      background: #888;
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }
    input:checked + .slider { background: #1a6b3c; }
    input:checked + .slider::before {
      transform: translateX(20px);
      background: #3ecf74;
    }

    /* ── Status ── */
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-bottom: 1px solid #232323;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #444;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .dot.on { background: #3ecf74; box-shadow: 0 0 6px #3ecf7480; }
    .status-text {
      font-size: 11px;
      color: #555;
      transition: color 0.3s;
    }
    .status-text.on { color: #3ecf74; }

    /* ── Settings ── */
    .settings {
      padding: 12px 16px;
      border-bottom: 1px solid #232323;
    }
    .settings-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #444;
      margin-bottom: 10px;
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .setting-row:last-child { margin-bottom: 0; }
    .setting-name {
      font-size: 12px;
      color: #aaa;
    }
    .setting-value {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .setting-value button {
      width: 20px; height: 20px;
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 4px;
      color: #888;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .setting-value button:hover { background: #333; color: #ccc; }
    .setting-num {
      font-size: 12px;
      font-weight: 600;
      color: #ddd;
      min-width: 24px;
      text-align: center;
    }

    /* ── Footer ── */
    .footer {
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .footer-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #8b5cf6;
    }
    .footer-text {
      font-size: 10px;
      color: #444;
    }

    /* ── Move log ── */
    .log {
      padding: 0 16px 12px;
    }
    .log-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #444;
      margin-bottom: 6px;
    }
    .log-entries {
      max-height: 64px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .log-entry {
      font-size: 11px;
      color: #555;
      font-family: 'Consolas', monospace;
    }
    .log-entry.new { color: #3ecf74; }
    .log-entries::-webkit-scrollbar { width: 3px; }
    .log-entries::-webkit-scrollbar-track { background: transparent; }
    .log-entries::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-icon">♟</div>
    <div>
      <div class="header-title">Engine Pilot</div>
      <div class="header-sub">Lichess auto-move assistant</div>
    </div>
  </div>

  <div class="toggle-row">
    <span class="toggle-label">Auto-play engine</span>
    <label class="switch">
      <input type="checkbox" id="toggleSwitch" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="status-row">
    <div class="dot" id="statusDot"></div>
    <span class="status-text" id="statusText">Inactive — open a Lichess game</span>
  </div>

  <div class="settings">
    <div class="settings-title">Engine settings</div>

    <div class="setting-row">
      <span class="setting-name">Depth</span>
      <div class="setting-value">
        <button id="depthDown">−</button>
        <span class="setting-num" id="depthVal">12</span>
        <button id="depthUp">+</button>
      </div>
    </div>

    <div class="setting-row">
      <span class="setting-name">Move delay (ms)</span>
      <div class="setting-value">
        <button id="delayDown">−</button>
        <span class="setting-num" id="delayVal">180</span>
        <button id="delayUp">+</button>
      </div>
    </div>
  </div>

  <div class="log">
    <div class="log-title">Move log</div>
    <div class="log-entries" id="logEntries">
      <div class="log-entry" style="color:#333">— no moves yet —</div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-dot"></div>
    <span class="footer-text">Uses stockfish.online · depth limited for speed</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
